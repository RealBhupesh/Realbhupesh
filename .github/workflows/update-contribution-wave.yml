name: Update contribution wave

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-wave
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql \
            -f query='query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        contributionCount
                        contributionLevel
                        date
                        weekday
                      }
                    }
                  }
                }
              }
            }' \
            -F login="$PROFILE_LOGIN" > "$RUNNER_TEMP/contributions.json"

      - name: Generate animated SVG
        run: |
          python3 scripts/generate_contribution_wave.py \
            "$RUNNER_TEMP/contributions.json" \
            assets/contribution-wave.svg

      - name: Commit refreshed activity
        run: |
          if git diff --quiet -- assets/contribution-wave.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-wave.svg
          git commit -m "Refresh contribution wave"
          git push
